<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../css/flashcard.css">
</head>
<body>

  <!-- ===== Hidden Controls ===== -->
  <input type="checkbox" id="dark-mode" class="hidden-input">

  <!-- ===== Site Wrapper ===== -->
  <div class="site-wrapper">

    <header class="site-header">
      <nav class="nav">
        <a href="../index.html" class="brand">
          <span class="brand-icon">⊞</span>
          DevFlash
        </a>
        <div class="nav-breadcrumb">
          <span class="sep">/</span>
          <a href="../index.html">홈</a>
          <span class="sep">/</span>
          <span class="current">1주차 퀴즈</span>
        </div>
        <label for="dark-mode" class="night-toggle">🌙 Night Mode</label>
      </nav>
      <div class="progress-section">
        <span class="progress-text">1주차 · 12 카드</span>
      </div>
    </header>

    <div class="page-nav">
      <div></div>
      <div><a href="../week/week01.html" class="btn-nav">학습 내용 보기</a></div>
      <div><a href="week02.html" class="btn-nav">다음 주차 →</a></div>
    </div>

    <!-- Cards -->
    <div class="content">
      <div class="cards-grid">

        <div class="card">
          <input type="checkbox" id="flip-week01-01" class="card-toggle hidden-input">
          <label class="card-inner" for="flip-week01-01">
            <div class="card-front">
              <span class="tag tag-html">HTML</span>
              <p class="question">Q. &lt;!DOCTYPE html&gt; 선언의 역할은?</p>
              <span class="card-hint">클릭하여 답 확인 →</span>
            </div>
            <div class="card-back">
              <span class="tag tag-html">HTML</span>
              <p class="answer">A. 이 문서가 <strong>HTML5</strong>임을 브라우저에 알린다. <strong>표준 모드(Standards Mode)</strong>로 렌더링되게 하여 quirks mode 오작동을 방지.</p>
              <span class="card-hint">← 다시 보기</span>
            </div>
          </label>
        </div>

        <div class="card">
          <input type="checkbox" id="flip-week01-02" class="card-toggle hidden-input">
          <label class="card-inner" for="flip-week01-02">
            <div class="card-front">
              <span class="tag tag-html">HTML</span>
              <p class="question">Q. 블록 요소와 인라인 요소의 차이는?</p>
              <span class="card-hint">클릭하여 답 확인 →</span>
            </div>
            <div class="card-back">
              <span class="tag tag-html">HTML</span>
              <p class="answer"><strong>Block</strong>: 항상 새 줄 시작, width 100%, height/margin 지정 가능. (<code>div</code>, <code>p</code>, <code>h1</code>)<br><strong>Inline</strong>: 줄 안에 배치, 너비·높이 지정 불가. (<code>span</code>, <code>a</code>, <code>strong</code>)</p>
              <span class="card-hint">← 다시 보기</span>
            </div>
          </label>
        </div>

        <div class="card">
          <input type="checkbox" id="flip-week01-03" class="card-toggle hidden-input">
          <label class="card-inner" for="flip-week01-03">
            <div class="card-front">
              <span class="tag tag-html">HTML</span>
              <p class="question">Q. href와 src 속성의 차이는?</p>
              <span class="card-hint">클릭하여 답 확인 →</span>
            </div>
            <div class="card-back">
              <span class="tag tag-html">HTML</span>
              <p class="answer"><strong>href</strong> (Hypertext Reference): 다른 리소스로 연결. <code>&lt;a&gt;</code>, <code>&lt;link&gt;</code><br><strong>src</strong> (Source): 리소스를 현재 문서에 삽입. <code>&lt;img&gt;</code>, <code>&lt;script&gt;</code>, <code>&lt;iframe&gt;</code></p>
              <span class="card-hint">← 다시 보기</span>
            </div>
          </label>
        </div>

        <div class="card">
          <input type="checkbox" id="flip-week01-04" class="card-toggle hidden-input">
          <label class="card-inner" for="flip-week01-04">
            <div class="card-front">
              <span class="tag tag-html">HTML</span>
              <p class="question">Q. id와 class 속성의 차이는?</p>
              <span class="card-hint">클릭하여 답 확인 →</span>
            </div>
            <div class="card-back">
              <span class="tag tag-html">HTML</span>
              <p class="answer"><strong>id</strong>: 페이지 내 <strong>유일한</strong> 식별자. 하나의 요소에만 사용. CSS에서 <code>#id</code>로 참조.<br><strong>class</strong>: <strong>여러 요소</strong>에 재사용 가능. CSS에서 <code>.class</code>로 참조.</p>
              <span class="card-hint">← 다시 보기</span>
            </div>
          </label>
        </div>

        <!-- ==================== CSS Cards ==================== -->

        <div class="card">
          <input type="checkbox" id="flip-week01-05" class="card-toggle hidden-input">
          <label class="card-inner" for="flip-week01-05">
            <div class="card-front">
              <span class="tag tag-css">CSS</span>
              <p class="question">Q. CSS 선택자 우선순위(명시도) 순서는?</p>
              <span class="card-hint">클릭하여 답 확인 →</span>
            </div>
            <div class="card-back">
              <span class="tag tag-css">CSS</span>
              <p class="answer"><strong>인라인 style</strong> (1,0,0,0)<br>&gt; <strong>id</strong> 선택자 (0,1,0,0)<br>&gt; <strong>class</strong> · 속성 · 가상클래스 (0,0,1,0)<br>&gt; <strong>태그</strong> · 가상요소 (0,0,0,1)</p>
              <span class="card-hint">← 다시 보기</span>
            </div>
          </label>
        </div>

        <div class="card">
          <input type="checkbox" id="flip-week01-06" class="card-toggle hidden-input">
          <label class="card-inner" for="flip-week01-06">
            <div class="card-front">
              <span class="tag tag-css">CSS</span>
              <p class="question">Q. position: relative와 absolute의 차이는?</p>
              <span class="card-hint">클릭하여 답 확인 →</span>
            </div>
            <div class="card-back">
              <span class="tag tag-css">CSS</span>
              <p class="answer"><strong>relative</strong>: 원래 위치 기준으로 이동. 문서 흐름 공간 유지.<br><strong>absolute</strong>: <code>position</code>이 지정된 가장 가까운 조상 기준. 문서 흐름에서 제거.</p>
              <span class="card-hint">← 다시 보기</span>
            </div>
          </label>
        </div>

        <div class="card">
          <input type="checkbox" id="flip-week01-07" class="card-toggle hidden-input">
          <label class="card-inner" for="flip-week01-07">
            <div class="card-front">
              <span class="tag tag-css">CSS</span>
              <p class="question">Q. 가상요소 ::before / ::after 사용 시 필수 속성은?</p>
              <span class="card-hint">클릭하여 답 확인 →</span>
            </div>
            <div class="card-back">
              <span class="tag tag-css">CSS</span>
              <p class="answer"><code>content</code> 속성이 <strong>필수</strong>. 값이 없어도 <code>content: ""</code>로 명시해야 렌더링됨.<br>요소의 앞(::before) · 뒤(::after)에 가상 콘텐츠를 삽입.</p>
              <span class="card-hint">← 다시 보기</span>
            </div>
          </label>
        </div>

        <div class="card">
          <input type="checkbox" id="flip-week01-08" class="card-toggle hidden-input">
          <label class="card-inner" for="flip-week01-08">
            <div class="card-front">
              <span class="tag tag-css">CSS</span>
              <p class="question">Q. display:none과 visibility:hidden 차이는?</p>
              <span class="card-hint">클릭하여 답 확인 →</span>
            </div>
            <div class="card-back">
              <span class="tag tag-css">CSS</span>
              <p class="answer"><code>display: none</code>: 요소가 완전히 제거됨. <strong>공간도 차지 안 함</strong>.<br><code>visibility: hidden</code>: 보이지 않지만 <strong>공간은 유지</strong>됨.</p>
              <span class="card-hint">← 다시 보기</span>
            </div>
          </label>
        </div>

        <!-- ==================== Box Model Cards ==================== -->

        <div class="card">
          <input type="checkbox" id="flip-week01-09" class="card-toggle hidden-input">
          <label class="card-inner" for="flip-week01-09">
            <div class="card-front">
              <span class="tag tag-boxmodel">Box Model</span>
              <p class="question">Q. Box Model의 4가지 구성 요소는?</p>
              <span class="card-hint">클릭하여 답 확인 →</span>
            </div>
            <div class="card-back">
              <span class="tag tag-boxmodel">Box Model</span>
              <p class="answer">안쪽부터: <strong>content</strong> → <strong>padding</strong> → <strong>border</strong> → <strong>margin</strong><br>content: 실제 내용 / padding: 내부 여백 / border: 테두리 / margin: 외부 여백</p>
              <span class="card-hint">← 다시 보기</span>
            </div>
          </label>
        </div>

        <div class="card">
          <input type="checkbox" id="flip-week01-10" class="card-toggle hidden-input">
          <label class="card-inner" for="flip-week01-10">
            <div class="card-front">
              <span class="tag tag-boxmodel">Box Model</span>
              <p class="question">Q. box-sizing: border-box의 효과는?</p>
              <span class="card-hint">클릭하여 답 확인 →</span>
            </div>
            <div class="card-back">
              <span class="tag tag-boxmodel">Box Model</span>
              <p class="answer">지정한 <code>width</code>/<code>height</code> 안에 <strong>padding과 border를 포함</strong>시켜 계산.<br>기본값(<code>content-box</code>)은 padding·border가 크기에 추가됨 → 레이아웃 계산이 복잡해짐.</p>
              <span class="card-hint">← 다시 보기</span>
            </div>
          </label>
        </div>

        <div class="card">
          <input type="checkbox" id="flip-week01-11" class="card-toggle hidden-input">
          <label class="card-inner" for="flip-week01-11">
            <div class="card-front">
              <span class="tag tag-boxmodel">Box Model</span>
              <p class="question">Q. margin: auto는 언제 사용하나?</p>
              <span class="card-hint">클릭하여 답 확인 →</span>
            </div>
            <div class="card-back">
              <span class="tag tag-boxmodel">Box Model</span>
              <p class="answer">블록 요소를 <strong>수평 중앙 정렬</strong>할 때 사용.<br><code>width</code>가 지정되어 있어야 하며, 남은 공간을 양쪽 margin에 균등 분배.<br>세로 방향에는 효과 없음.</p>
              <span class="card-hint">← 다시 보기</span>
            </div>
          </label>
        </div>

        <div class="card">
          <input type="checkbox" id="flip-week01-12" class="card-toggle hidden-input">
          <label class="card-inner" for="flip-week01-12">
            <div class="card-front">
              <span class="tag tag-boxmodel">Box Model</span>
              <p class="question">Q. padding과 margin의 핵심 차이는?</p>
              <span class="card-hint">클릭하여 답 확인 →</span>
            </div>
            <div class="card-back">
              <span class="tag tag-boxmodel">Box Model</span>
              <p class="answer"><strong>padding</strong>: 요소 <strong>내부</strong> 여백. 배경색이 적용됨. 클릭 영역 포함.<br><strong>margin</strong>: 요소 <strong>외부</strong> 여백. 배경색 미적용. 인접 요소와의 간격 조절.</p>
              <span class="card-hint">← 다시 보기</span>
            </div>
          </label>
        </div>

      </div><!-- /cards-grid -->
    </div><!-- /content -->

    <footer class="site-footer">
      HTML5 · CSS3 only — no JavaScript &nbsp;|&nbsp; 웹프로그래밍기초 프로젝트
    </footer>

  </div><!-- /site-wrapper -->

</body>
</html>
