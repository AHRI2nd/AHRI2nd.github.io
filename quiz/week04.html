    <!-- Cards -->
    <div class="content">
      <div class="cards-grid">

        <!-- ==================== CSS 기초 ==================== -->

        <div class="card css-card">
          <input type="checkbox" id="flip-week04-01" class="card-toggle hidden-input">
          <label class="card-inner" for="flip-week04-01">
            <div class="card-front">
              <span class="tag tag-css">CSS</span>
              <p class="question">Q. CSS를 HTML에 적용하는 3가지 방법은?</p>
              <span class="card-hint">클릭하여 답 확인 →</span>
            </div>
            <div class="card-back">
              <span class="tag tag-css">CSS</span>
              <p class="answer"><strong>① 인라인(Inline)</strong>: 태그의 style 속성에 직접 작성.<br><strong>② 내부(Internal)</strong>: &lt;head&gt; 안에 &lt;style&gt; 태그로 작성.<br><strong>③ 외부(External)</strong>: 별도 .css 파일을 &lt;link&gt; 태그로 연결.</p>
              <span class="card-hint">← 다시 보기</span>
            </div>
          </label>
        </div>

        <div class="card css-card">
          <input type="checkbox" id="flip-week04-02" class="card-toggle hidden-input">
          <label class="card-inner" for="flip-week04-02">
            <div class="card-front">
              <span class="tag tag-css">CSS</span>
              <p class="question">Q. 외부 스타일시트를 연결하는 태그 작성법은?</p>
              <span class="card-hint">클릭하여 답 확인 →</span>
            </div>
            <div class="card-back">
              <span class="tag tag-css">CSS</span>
              <p class="answer"><code>&lt;link rel="stylesheet" href="style.css"&gt;</code><br>&lt;head&gt; 안에 작성한다.<br><code>rel="stylesheet"</code>: 연결 파일이 스타일시트임을 명시.<br><code>href</code>: CSS 파일 경로.</p>
              <span class="card-hint">← 다시 보기</span>
            </div>
          </label>
        </div>

        <div class="card css-card">
          <input type="checkbox" id="flip-week04-03" class="card-toggle hidden-input">
          <label class="card-inner" for="flip-week04-03">
            <div class="card-front">
              <span class="tag tag-css">CSS</span>
              <p class="question">Q. CSS 기본 문법 구조는?</p>
              <span class="card-hint">클릭하여 답 확인 →</span>
            </div>
            <div class="card-back">
              <span class="tag tag-css">CSS</span>
              <p class="answer"><code>선택자 { 속성: 값; }</code><br><strong>선택자(selector)</strong>: 스타일을 적용할 HTML 요소 지정.<br><strong>속성(property)</strong>: 변경할 스타일 항목 (예: color).<br><strong>값(value)</strong>: 속성에 할당할 내용 (예: red).</p>
              <span class="card-hint">← 다시 보기</span>
            </div>
          </label>
        </div>

        <!-- ==================== CSS 선택자 ==================== -->

        <div class="card css-card">
          <input type="checkbox" id="flip-week04-04" class="card-toggle hidden-input">
          <label class="card-inner" for="flip-week04-04">
            <div class="card-front">
              <span class="tag tag-css">CSS</span>
              <p class="question">Q. CSS 선택자 5가지 종류와 문법은?</p>
              <span class="card-hint">클릭하여 답 확인 →</span>
            </div>
            <div class="card-back">
              <span class="tag tag-css">CSS</span>
              <p class="answer"><strong>요소 선택자</strong>: <code>p { }</code> — 해당 태그 전체 선택<br><strong>클래스 선택자</strong>: <code>.menu { }</code> — class 속성으로 선택<br><strong>태그+클래스</strong>: <code>h1.title { }</code> — 특정 태그의 특정 클래스<br><strong>ID 선택자</strong>: <code>#wrap { }</code> — id 속성으로 선택 (페이지에서 유일)<br><strong>전체 선택자</strong>: <code>* { }</code> — 모든 요소 선택</p>
              <span class="card-hint">← 다시 보기</span>
            </div>
          </label>
        </div>

        <div class="card css-card">
          <input type="checkbox" id="flip-week04-05" class="card-toggle hidden-input">
          <label class="card-inner" for="flip-week04-05">
            <div class="card-front">
              <span class="tag tag-css">CSS</span>
              <p class="question">Q. 클래스 선택자와 ID 선택자의 차이는?</p>
              <span class="card-hint">클릭하여 답 확인 →</span>
            </div>
            <div class="card-back">
              <span class="tag tag-css">CSS</span>
              <p class="answer"><strong>클래스 선택자</strong> (<code>.클래스명</code>): 여러 요소에 동일 클래스 재사용 가능.<br><strong>ID 선택자</strong> (<code>#아이디명</code>): 페이지 내에서 <strong>유일</strong>한 요소 하나에만 사용.<br>ID는 중복 사용 시 HTML 오류이므로 레이아웃 구역에 주로 사용.</p>
              <span class="card-hint">← 다시 보기</span>
            </div>
          </label>
        </div>

        <div class="card css-card">
          <input type="checkbox" id="flip-week04-06" class="card-toggle hidden-input">
          <label class="card-inner" for="flip-week04-06">
            <div class="card-front">
              <span class="tag tag-css">CSS</span>
              <p class="question">Q. color, background-color, font-size, text-align, padding 속성의 역할은?</p>
              <span class="card-hint">클릭하여 답 확인 →</span>
            </div>
            <div class="card-back">
              <span class="tag tag-css">CSS</span>
              <p class="answer"><code>color</code>: 글자 색상<br><code>background-color</code>: 배경 색상<br><code>font-size</code>: 글자 크기 (px, em, % 등)<br><code>text-align</code>: 텍스트 정렬 (left·center·right)<br><code>padding</code>: 요소 안쪽 여백</p>
              <span class="card-hint">← 다시 보기</span>
            </div>
          </label>
        </div>

        <div class="card css-card">
          <input type="checkbox" id="flip-week04-07" class="card-toggle hidden-input">
          <label class="card-inner" for="flip-week04-07">
            <div class="card-front">
              <span class="tag tag-css">CSS</span>
              <p class="question">Q. <code>h1.title { color: blue; }</code>는 어떤 요소에 적용되나?</p>
              <span class="card-hint">클릭하여 답 확인 →</span>
            </div>
            <div class="card-back">
              <span class="tag tag-css">CSS</span>
              <p class="answer"><strong>태그+클래스 선택자</strong>로, <code>&lt;h1 class="title"&gt;</code>에만 적용된다.<br><code>&lt;p class="title"&gt;</code>에는 적용되지 않음.<br>특정 태그의 특정 클래스에만 스타일을 줄 때 사용.</p>
              <span class="card-hint">← 다시 보기</span>
            </div>
          </label>
        </div>

        <!-- ==================== 시맨틱 태그 ==================== -->

        <div class="card html-card">
          <input type="checkbox" id="flip-week04-08" class="card-toggle hidden-input">
          <label class="card-inner" for="flip-week04-08">
            <div class="card-front">
              <span class="tag tag-html">HTML</span>
              <p class="question">Q. HTML5 시맨틱 태그 7가지와 각 역할은?</p>
              <span class="card-hint">클릭하여 답 확인 →</span>
            </div>
            <div class="card-back">
              <span class="tag tag-html">HTML</span>
              <p class="answer"><code>&lt;header&gt;</code>: 페이지·섹션 머리글 (로고, 제목)<br><code>&lt;nav&gt;</code>: 주요 내비게이션 링크 묶음<br><code>&lt;main&gt;</code>: 문서의 핵심 콘텐츠 (페이지에서 1개)<br><code>&lt;section&gt;</code>: 주제별 콘텐츠 구역<br><code>&lt;article&gt;</code>: 독립적으로 배포 가능한 콘텐츠<br><code>&lt;aside&gt;</code>: 부가 정보·사이드바<br><code>&lt;footer&gt;</code>: 하단 정보 (저작권, 연락처)</p>
              <span class="card-hint">← 다시 보기</span>
            </div>
          </label>
        </div>

        <div class="card html-card">
          <input type="checkbox" id="flip-week04-09" class="card-toggle hidden-input">
          <label class="card-inner" for="flip-week04-09">
            <div class="card-front">
              <span class="tag tag-html">HTML</span>
              <p class="question">Q. &lt;section&gt;과 &lt;article&gt;의 차이는?</p>
              <span class="card-hint">클릭하여 답 확인 →</span>
            </div>
            <div class="card-back">
              <span class="tag tag-html">HTML</span>
              <p class="answer"><strong>&lt;section&gt;</strong>: 주제별 구역 구분. 페이지 내부 일부로서 맥락에 종속됨.<br><strong>&lt;article&gt;</strong>: 독립적으로 의미가 완결되는 콘텐츠.<br>(블로그 포스트, 뉴스 기사 등은 article; 페이지 구역 나누기는 section)</p>
              <span class="card-hint">← 다시 보기</span>
            </div>
          </label>
        </div>

        <div class="card html-card">
          <input type="checkbox" id="flip-week04-10" class="card-toggle hidden-input">
          <label class="card-inner" for="flip-week04-10">
            <div class="card-front">
              <span class="tag tag-html">HTML</span>
              <p class="question">Q. &lt;div&gt;와 시맨틱 태그의 차이는?</p>
              <span class="card-hint">클릭하여 답 확인 →</span>
            </div>
            <div class="card-back">
              <span class="tag tag-html">HTML</span>
              <p class="answer"><code>&lt;div&gt;</code>: 의미 없는 컨테이너. 레이아웃 목적으로만 사용.<br><strong>시맨틱 태그</strong>: 역할·의미를 담아 검색엔진 최적화(SEO), 접근성(스크린 리더), 코드 가독성을 높임.<br>가능하면 div 대신 의미에 맞는 시맨틱 태그 사용 권장.</p>
              <span class="card-hint">← 다시 보기</span>
            </div>
          </label>
        </div>

        <div class="card html-card">
          <input type="checkbox" id="flip-week04-11" class="card-toggle hidden-input">
          <label class="card-inner" for="flip-week04-11">
            <div class="card-front">
              <span class="tag tag-html">HTML</span>
              <p class="question">Q. 시맨틱 태그에 클래스를 함께 사용하는 이유는?</p>
              <span class="card-hint">클릭하여 답 확인 →</span>
            </div>
            <div class="card-back">
              <span class="tag tag-html">HTML</span>
              <p class="answer">시맨틱 태그는 구조·의미를 나타내고, 클래스는 CSS 스타일 적용을 위해 사용.<br>예: <code>&lt;nav class="gnb"&gt;</code> — nav로 내비게이션임을 명시하고, .gnb 클래스로 디자인 스타일 지정.<br>구조와 스타일 역할을 분리하여 유지보수가 쉬워짐.</p>
              <span class="card-hint">← 다시 보기</span>
            </div>
          </label>
        </div>

        <div class="card css-card">
          <input type="checkbox" id="flip-week04-12" class="card-toggle hidden-input">
          <label class="card-inner" for="flip-week04-12">
            <div class="card-front">
              <span class="tag tag-css">CSS</span>
              <p class="question">Q. 인라인 스타일과 외부 스타일시트 중 어느 것이 우선 적용되나?</p>
              <span class="card-hint">클릭하여 답 확인 →</span>
            </div>
            <div class="card-back">
              <span class="tag tag-css">CSS</span>
              <p class="answer"><strong>인라인 스타일</strong>이 가장 높은 우선순위를 가진다.<br>우선순위: 인라인 &gt; 내부 스타일시트 &gt; 외부 스타일시트<br>인라인은 유지보수가 어렵기 때문에, 일반적으로 외부 스타일시트 사용을 권장.</p>
              <span class="card-hint">← 다시 보기</span>
            </div>
          </label>
        </div>

      </div><!-- /cards-grid -->
    </div><!-- /content -->

    <footer class="site-footer">
      HTML5 · CSS3 only — no JavaScript &nbsp;|&nbsp; 웹프로그래밍기초 프로젝트
    </footer>

  </div><!-- /site-wrapper -->

</body>
</html>
