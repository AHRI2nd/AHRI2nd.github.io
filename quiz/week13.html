      <div></div>

    <!-- Cards -->
    <div class="content">
      <div class="cards-grid">

        <!-- ==================== position 4종 ==================== -->
        <div class="card">
          <input type="checkbox" id="flip-week13-01" class="card-toggle hidden-input">
          <label class="card-inner" for="flip-week13-01">
            <div class="card-front">
              <span class="tag tag-css">CSS</span>
              <p class="question">Q. <code>position</code>의 네 가지 값(<code>static</code>·<code>relative</code>·<code>absolute</code>·<code>fixed</code>)의 배치 기준은 각각 무엇인가?</p>
              <span class="card-hint">클릭하여 답 확인 →</span>
            </div>
            <div class="card-back">
              <span class="tag tag-css">CSS</span>
              <div class="answer"><code>static</code>: 기본값, 배치 안 함.<br><code>relative</code>: <strong>자기 원래 위치</strong> 기준.<br><code>absolute</code>: <strong>가장 가까운 positioned 조상</strong> 기준.<br><code>fixed</code>: <strong>브라우저 화면(뷰포트)</strong> 기준.</div>
              <span class="card-hint">← 다시 보기</span>
            </div>
          </label>
        </div>

        <!-- ==================== static ==================== -->
        <div class="card">
          <input type="checkbox" id="flip-week13-02" class="card-toggle hidden-input">
          <label class="card-inner" for="flip-week13-02">
            <div class="card-front">
              <span class="tag tag-css">CSS</span>
              <p class="question">Q. <code>position: static</code>인 요소에 <code>top: 30px</code>을 주면 어떻게 되나?</p>
              <span class="card-hint">클릭하여 답 확인 →</span>
            </div>
            <div class="card-back">
              <span class="tag tag-css">CSS</span>
              <div class="answer"><strong>무시된다.</strong> <code>static</code>은 모든 요소의 기본값으로, <code>top</code>/<code>right</code>/<code>bottom</code>/<code>left</code> 값이 적용되지 않고 일반 문서 흐름대로 배치됨.</div>
              <span class="card-hint">← 다시 보기</span>
            </div>
          </label>
        </div>

        <!-- ==================== relative ==================== -->
        <div class="card">
          <input type="checkbox" id="flip-week13-03" class="card-toggle hidden-input">
          <label class="card-inner" for="flip-week13-03">
            <div class="card-front">
              <span class="tag tag-css">CSS</span>
              <p class="question">Q. <code>position: relative; left: 30px;</code>일 때 요소와 주변 요소는 어떻게 되나?</p>
              <span class="card-hint">클릭하여 답 확인 →</span>
            </div>
            <div class="card-back">
              <span class="tag tag-css">CSS</span>
              <div class="answer">요소는 <strong>원래 위치에서 오른쪽으로 30px 이동</strong>.<br>중요: <strong>원래 자리는 그대로 차지</strong>하므로 주변 요소는 밀려나지 않고 그 자리에 빈 공간이 남음.</div>
              <span class="card-hint">← 다시 보기</span>
            </div>
          </label>
        </div>

        <!-- ==================== absolute 기준 ==================== -->
        <div class="card">
          <input type="checkbox" id="flip-week13-04" class="card-toggle hidden-input">
          <label class="card-inner" for="flip-week13-04">
            <div class="card-front">
              <span class="tag tag-css">CSS</span>
              <p class="question">Q. <code>position: absolute</code> 요소는 무엇을 기준으로 배치되나? 기준이 될 조상이 없으면?</p>
              <span class="card-hint">클릭하여 답 확인 →</span>
            </div>
            <div class="card-back">
              <span class="tag tag-css">CSS</span>
              <div class="answer"><strong>가장 가까운 positioned 조상</strong>(<code>static</code>이 아닌 조상, 보통 <code>relative</code>)을 기준으로 배치.<br>그런 조상이 없으면 <strong><code>&lt;body&gt;</code>(문서 전체)</strong>가 기준이 됨. 또한 일반 흐름에서 <strong>빠져나와</strong> 원래 공간이 사라짐.</div>
              <span class="card-hint">← 다시 보기</span>
            </div>
          </label>
        </div>

        <!-- ==================== relative + absolute 패턴 ==================== -->
        <div class="card">
          <input type="checkbox" id="flip-week13-05" class="card-toggle hidden-input">
          <label class="card-inner" for="flip-week13-05">
            <div class="card-front">
              <span class="tag tag-css">CSS</span>
              <p class="question">Q. 자식 요소를 부모 영역 안에서 좌표로 배치하려 한다. 부모·자식에 어떤 <code>position</code>을 주나?</p>
              <span class="card-hint">클릭하여 답 확인 →</span>
            </div>
            <div class="card-back">
              <span class="tag tag-css">CSS</span>
              <div class="answer">부모에 <code>position: relative</code>(좌표는 안 줌, 기준점 역할), 자식에 <code>position: absolute</code> + 좌표.<br><pre>#container { position: relative; }
#two {
  position: absolute;
  top: 30px; left: 30px;
}</pre>부모에 relative가 없으면 자식이 화면(body) 기준으로 엉뚱한 곳에 감.</div>
              <span class="card-hint">← 다시 보기</span>
            </div>
          </label>
        </div>

        <!-- ==================== fixed ==================== -->
        <div class="card">
          <input type="checkbox" id="flip-week13-06" class="card-toggle hidden-input">
          <label class="card-inner" for="flip-week13-06">
            <div class="card-front">
              <span class="tag tag-css">CSS</span>
              <p class="question">Q. <code>position: fixed</code>의 특징은? 어떤 UI에 쓰나?</p>
              <span class="card-hint">클릭하여 답 확인 →</span>
            </div>
            <div class="card-back">
              <span class="tag tag-css">CSS</span>
              <div class="answer"><strong>뷰포트(화면)</strong>를 기준으로 고정되며, 페이지를 스크롤해도 <strong>항상 같은 자리</strong>에 머무름.<br>상단 고정 헤더, "맨 위로" 버튼, 떠 있는 채팅 버튼 등에 사용.<br><pre>#topbar {
  position: fixed;
  top: 0; right: 0;
}</pre></div>
              <span class="card-hint">← 다시 보기</span>
            </div>
          </label>
        </div>

        <!-- ==================== grid ==================== -->
        <div class="card">
          <input type="checkbox" id="flip-week13-07" class="card-toggle hidden-input">
          <label class="card-inner" for="flip-week13-07">
            <div class="card-front">
              <span class="tag tag-css">CSS</span>
              <p class="question">Q. Grid 레이아웃을 시작하고 3개의 균등한 열을 만들려면?</p>
              <span class="card-hint">클릭하여 답 확인 →</span>
            </div>
            <div class="card-back">
              <span class="tag tag-css">CSS</span>
              <div class="answer">컨테이너에 <code>display: grid</code> + <code>grid-template-columns</code>로 열 지정.<br><pre>.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}</pre><code>1fr</code> = 남은 공간 1비율, <code>repeat(3, 1fr)</code> = 3등분.</div>
              <span class="card-hint">← 다시 보기</span>
            </div>
          </label>
        </div>

        <!-- ==================== grid 반응형 ==================== -->
        <div class="card">
          <input type="checkbox" id="flip-week13-08" class="card-toggle hidden-input">
          <label class="card-inner" for="flip-week13-08">
            <div class="card-front">
              <span class="tag tag-css">CSS</span>
              <p class="question">Q. grid로 모바일 1단 / 태블릿 2단 / 데스크톱 3단 반응형을 만들려면?</p>
              <span class="card-hint">클릭하여 답 확인 →</span>
            </div>
            <div class="card-back">
              <span class="tag tag-css">CSS</span>
              <div class="answer">기본을 1단으로 두고 미디어쿼리로 열 수를 늘림.<br><pre>.grid { grid-template-columns: 1fr; }

@media (min-width: 768px) {
  .grid { grid-template-columns: repeat(2, 1fr); }
}
@media (min-width: 1024px) {
  .grid { grid-template-columns: repeat(3, 1fr); }
}</pre></div>
              <span class="card-hint">← 다시 보기</span>
            </div>
          </label>
        </div>

        <!-- ==================== float ==================== -->
        <div class="card">
          <input type="checkbox" id="flip-week13-09" class="card-toggle hidden-input">
          <label class="card-inner" for="flip-week13-09">
            <div class="card-front">
              <span class="tag tag-css">CSS</span>
              <p class="question">Q. <code>float: left</code>를 이미지에 주면 어떤 효과가 나나?</p>
              <span class="card-hint">클릭하여 답 확인 →</span>
            </div>
            <div class="card-back">
              <span class="tag tag-css">CSS</span>
              <div class="answer">이미지를 <strong>왼쪽으로 띄우고</strong>, 뒤따르는 텍스트가 이미지의 <strong>오른쪽을 감싸며 흐름</strong>(신문 편집 효과).<br><pre>img {
  float: left;
  margin-right: 40px;
}</pre></div>
              <span class="card-hint">← 다시 보기</span>
            </div>
          </label>
        </div>

        <!-- ==================== clear ==================== -->
        <div class="card">
          <input type="checkbox" id="flip-week13-10" class="card-toggle hidden-input">
          <label class="card-inner" for="flip-week13-10">
            <div class="card-front">
              <span class="tag tag-css">CSS</span>
              <p class="question">Q. <code>float</code> 때문에 레이아웃이 무너질 때(다음 요소가 파고들 때) 해결하는 속성은?</p>
              <span class="card-hint">클릭하여 답 확인 →</span>
            </div>
            <div class="card-back">
              <span class="tag tag-css">CSS</span>
              <div class="answer"><code>clear</code> 속성으로 float 흐름을 끊음.<br><pre>.clear { clear: both; }</pre>좌(<code>left</code>)·우(<code>right</code>)·양쪽(<code>both</code>) float을 해제. 보통 빈 <code>div</code>에 적용해 다음 요소를 정상 흐름으로 되돌림.</div>
              <span class="card-hint">← 다시 보기</span>
            </div>
          </label>
        </div>

        <!-- ==================== float vs position 메뉴 ==================== -->
        <div class="card">
          <input type="checkbox" id="flip-week13-11" class="card-toggle hidden-input">
          <label class="card-inner" for="flip-week13-11">
            <div class="card-front">
              <span class="tag tag-css">CSS</span>
              <p class="question">Q. 로고(왼쪽) + 메뉴(오른쪽) 헤더를 float 방식과 position 방식으로 만들 때 차이는?</p>
              <span class="card-hint">클릭하여 답 확인 →</span>
            </div>
            <div class="card-back">
              <span class="tag tag-css">CSS</span>
              <div class="answer"><strong>float 방식</strong>: <code>#logo {float:left}</code>, <code>#top_menu {float:right}</code> + <code>clear</code> 필요.<br><strong>position 방식</strong>: <code>#header {position:relative}</code>를 기준으로 <code>#top_menu {position:absolute; right:20px}</code>처럼 좌표로 정밀 고정.</div>
              <span class="card-hint">← 다시 보기</span>
            </div>
          </label>
        </div>

        <!-- ==================== iframe ==================== -->
        <div class="card">
          <input type="checkbox" id="flip-week13-12" class="card-toggle hidden-input">
          <label class="card-inner" for="flip-week13-12">
            <div class="card-front">
              <span class="tag tag-css">HTML</span>
              <p class="question">Q. 유튜브 영상을 페이지에 삽입할 때 쓰는 태그와 주의점은? <code>video</code>와는 어떻게 다른가?</p>
              <span class="card-hint">클릭하여 답 확인 →</span>
            </div>
            <div class="card-back">
              <span class="tag tag-css">HTML</span>
              <div class="answer"><code>&lt;iframe&gt;</code>으로 외부 페이지를 임베드. 유튜브는 시청 주소가 아니라 <strong>임베드 주소(<code>/embed/</code>)</strong>를 써야 함.<br><pre>&lt;iframe width="400" height="300"
  src="https://www.youtube.com/embed/ID"
  allowfullscreen&gt;&lt;/iframe&gt;</pre><code>&lt;video&gt;</code>는 <strong>내 서버에 있는 동영상 파일</strong> 재생용.</div>
              <span class="card-hint">← 다시 보기</span>
            </div>
          </label>
        </div>

      </div><!-- /cards-grid -->
    </div><!-- /content -->

    <footer class="site-footer">
      HTML5 · CSS3 only — no JavaScript &nbsp;|&nbsp; 웹프로그래밍기초 프로젝트
    </footer>

  </div><!-- /site-wrapper -->

</body>
